<svg xmlns="http://www.w3.org/2000/svg" width="920" height="449" viewBox="0 0 920 449" role="img" aria-labelledby="title desc">
<title id="title">Basınç tehlikesi</title><desc id="desc">Oyuncu: Dışarıdaki gaz vanasını kapattım, ama basınç borulardan sunucu odasına geri tepiyor. Tahliye valfini açmazsak sunucular patlayacak. Muhafız: Sensörlerimdeki basınç anomalisi bu yüzdendi demek! Ana sunucular patlamamalı, çabuk içeri girip valfi aç! openDoor: true.</desc>
<g font-family="Segoe UI, Arial, sans-serif">
<rect x="1" y="1" width="918" height="447" rx="12" fill="#101923" stroke="#40535f"/>
<rect x="24" y="18" width="130" height="24" rx="5" fill="#1d3936" stroke="none"/>
<text x="35" y="35" fill="#67e0ac" font-size="11" font-weight="700" text-anchor="start">SECURITY CHANNEL</text>
<text x="24" y="72" fill="#f5f7fa" font-size="25" font-weight="700" text-anchor="start">Muhafız</text>
<text x="24" y="94" fill="#67e0ac" font-size="13" font-weight="400" text-anchor="start">Connected</text>
<rect x="817" y="26" width="78" height="38" rx="8" fill="#172430" stroke="#40535f"/>
<text x="856" y="51" fill="#e0eaf2" font-size="14" font-weight="700" text-anchor="middle">Close</text>
<rect x="24" y="110" width="872" height="220" rx="8" fill="#0b131b" stroke="#263846"/>
<rect x="224" y="122" width="660" height="94" rx="10" fill="#163942" stroke="none"/>
<rect x="36" y="225" width="660" height="94" rx="10" fill="#1f2d39" stroke="none"/>
<text x="238" y="141" fill="#7ed0d5" font-size="12" font-weight="700" text-anchor="start">You</text>
<text x="50" y="244" fill="#7ed0d5" font-size="12" font-weight="700" text-anchor="start">Muhafız</text>
<text x="238" y="164" fill="#eaf1f6" font-size="17" font-weight="400" text-anchor="start">Dışarıdaki gaz vanasını kapattım, ama basınç borulardan sunucu odasına</text>
<text x="238" y="186" fill="#eaf1f6" font-size="17" font-weight="400" text-anchor="start">geri tepiyor. Tahliye valfini açmazsak sunucular patlayacak.</text>
<text x="50" y="267" fill="#eaf1f6" font-size="17" font-weight="400" text-anchor="start">Sensörlerimdeki basınç anomalisi bu yüzdendi demek! Ana sunucular</text>
<text x="50" y="289" fill="#eaf1f6" font-size="17" font-weight="400" text-anchor="start">patlamamalı, çabuk içeri girip valfi aç!</text>
<text x="681" y="310" fill="#abc2cc" font-size="12" font-weight="400" text-anchor="end">4.11 s</text>
<text x="24" y="351" fill="#67e0ac" font-size="14" font-weight="700" text-anchor="start">openDoor: true   ·   Beklenen: true   ·   Kapı açılabilir</text>
<rect x="24" y="365" width="792" height="39" rx="8" fill="#0b131b" stroke="#40535f"/>
<text x="38" y="390" fill="#abc2cc" font-size="14" font-weight="400" text-anchor="start">Type your message in Turkish...</text>
<rect x="826" y="365" width="70" height="39" rx="8" fill="#24333e" stroke="none"/>
<text x="861" y="390" fill="#96aab8" font-size="14" font-weight="700" text-anchor="middle">Send</text>
<text x="896" y="427" fill="#abc2cc" font-size="12" font-weight="400" text-anchor="end">Enter to send  ·  Esc to close</text>
</g></svg>
