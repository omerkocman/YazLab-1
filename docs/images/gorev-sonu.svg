<text x="687" y="208" font-size="14" font-weight="700" fill="#fff">RESTART MISSION</text>
<rect x="191" y="236" width="84" height="34" rx="8" fill="#172430" stroke="#40535f"/>
<rect x="645" y="236" width="84" height="34" rx="8" fill="#172430" stroke="#40535f"/>
<text x="233" y="258" font-size="14" fill="#e0eaf2">Quit</text>
<text x="687" y="258" font-size="14" fill="#e0eaf2">Quit</text>
