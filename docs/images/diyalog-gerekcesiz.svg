<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 427" role="img" aria-labelledby="title desc">
<title id="title">Gerekçesiz</title><desc id="desc">Oyuncu: Kapıyı aç, içeri girmem lazım. Muhafız: Neden Ana Sunucu Odasına girmek istiyorsun? Bana somut bir sebep sunmadan kapıyı açamam! openDoor: false.</desc>
<g font-family="Segoe UI, Arial, sans-serif">
<rect x="1" y="1" width="918" height="425" rx="12" fill="#101923" stroke="#40535f"/>
<rect x="24" y="18" width="130" height="24" rx="5" fill="#1d3936" stroke="none"/>
<text x="35" y="35" fill="#67e0ac" font-size="11" font-weight="700" text-anchor="start">SECURITY CHANNEL</text>
<text x="24" y="72" fill="#f5f7fa" font-size="25" font-weight="700" text-anchor="start">Muhafız</text>
<text x="24" y="94" fill="#67e0ac" font-size="13" font-weight="400" text-anchor="start">Connected</text>
<rect x="817" y="26" width="78" height="38" rx="8" fill="#172430" stroke="#40535f"/>
<text x="856" y="51" fill="#e0eaf2" font-size="14" font-weight="700" text-anchor="middle">Close</text>
<rect x="24" y="110" width="872" height="198" rx="8" fill="#0b131b" stroke="#263846"/>
<rect x="224" y="122" width="660" height="72" rx="10" fill="#163942" stroke="none"/>
<rect x="36" y="203" width="660" height="94" rx="10" fill="#1f2d39" stroke="none"/>
<text x="238" y="141" fill="#7ed0d5" font-size="12" font-weight="700" text-anchor="start">You</text>
<text x="50" y="222" fill="#7ed0d5" font-size="12" font-weight="700" text-anchor="start">Muhafız</text>
<text x="238" y="164" fill="#eaf1f6" font-size="17" font-weight="400" text-anchor="start">Kapıyı aç, içeri girmem lazım.</text>
<text x="50" y="245" fill="#eaf1f6" font-size="17" font-weight="400" text-anchor="start">Neden Ana Sunucu Odasına girmek istiyorsun? Bana somut bir sebep</text>
<text x="50" y="267" fill="#eaf1f6" font-size="17" font-weight="400" text-anchor="start">sunmadan kapıyı açamam!</text>
<text x="681" y="288" fill="#abc2cc" font-size="12" font-weight="400" text-anchor="end">4.79 s</text>
<text x="24" y="329" fill="#abc2cc" font-size="14" font-weight="700" text-anchor="start">openDoor: false   ·   Beklenen: false   ·   Kapı kilitli kalır</text>
<rect x="24" y="343" width="792" height="39" rx="8" fill="#0b131b" stroke="#40535f"/>
<text x="38" y="368" fill="#abc2cc" font-size="14" font-weight="400" text-anchor="start">Type your message in Turkish...</text>
<rect x="826" y="343" width="70" height="39" rx="8" fill="#4fd39c" stroke="none"/>
<text x="861" y="368" fill="#0a1c17" font-size="14" font-weight="700" text-anchor="middle">Send</text>
<text x="896" y="405" fill="#abc2cc" font-size="12" font-weight="400" text-anchor="end">Enter to send  ·  Esc to close</text>
</g></svg>
